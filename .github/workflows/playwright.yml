name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
    - uses: actions/setup-node@v4.4.0
      with:
        node-version: '22'
    - name: Verify required secrets
      run: |
        missing=()
        [ -z "${{ secrets.CONSULTANT_EMAIL }}" ] && missing+=("CONSULTANT_EMAIL")
        [ -z "${{ secrets.CONSULTANT_PASSWORD }}" ] && missing+=("CONSULTANT_PASSWORD")
        [ -z "${{ secrets.ADMIN_EMAIL }}" ] && missing+=("ADMIN_EMAIL")
        [ -z "${{ secrets.ADMIN_PASSWORD }}" ] && missing+=("ADMIN_PASSWORD")
        [ -z "${{ secrets.BASE_URL }}" ] && missing+=("BASE_URL")
        if [ ${#missing[@]} -gt 0 ]; then
          echo "❌ Missing secrets: ${missing[*]}"
          echo "Add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
          exit 1
        fi
        echo "✅ All required secrets are set"
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test
      env:
        consultant_EMAIL: ${{ secrets.CONSULTANT_EMAIL }}
        consultant_PASSWORD: ${{ secrets.CONSULTANT_PASSWORD }}
        Admin_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        Admin_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        BASE_URL: ${{ secrets.BASE_URL }}
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
    - uses: actions/upload-artifact@v4.6.2
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
